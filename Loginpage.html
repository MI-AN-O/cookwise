<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookWise - Login</title>
    <link rel="stylesheet" href="Loginpage.css">
</head>
<body>
    <header>
        <h1>
            <img src="Images/logo.svg" alt="" width="50" height="40">
            CookWise &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="Homepage.html">Home</a>
        </h1>
    </header>

    <div class="login-box">
        <h2>Login</h2>
        <!-- No backend yet: the form will be wired up when the project moves to Django -->
        <form action="#" method="post">
            <div class="user-box">
                <input type="text" name="username" required>
                <label>Username</label>
            </div>
            <div class="user-box">
                <input type="password" name="password" required>
                <label>Password</label>
            </div>

            <button type="submit">Login</button>
            <a href="#" class="forgot-password">Forgot Password?</a>
            <a href="Registration.html" class="forgot-password">No account? Register</a>
        </form>
    </div>
    <footer>
        <p>&copy; 2024 <img src="Images/logo.svg" alt="" width="16" height="16"> COOKWISE. All rights reserved.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookWise - Registration</title>
    <link rel="stylesheet" href="Registration.css">
</head>
<body>
    <header>
        <h1>
            <img src="Images/logo.svg" alt="" width="50" height="40">
            CookWise &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="Homepage.html">Home</a>
        </h1>
    </header>

    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" minlength="8" required>
        <button type="submit">Register</button>
        <p>Already have an account? <a href="Loginpage.html">Login</a></p>
    </form>
    <footer>
        <p>&copy; 2024 <img src="Images/logo.svg" alt="" width="16" height="16"> COOKWISE. All rights reserved.</p>
    </footer>
</body>
</html>
